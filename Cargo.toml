[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/nikuscs/wormhole"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
future_not_send = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
return_self_not_must_use = "allow"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures = "0.3"
bytes = "1.12"
flate2 = "1.1"
tar = "0.4"
quinn = "0.11"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pki-types = "1.15"
rcgen = "0.14"
instant-acme = "0.8"
x509-parser = "0.18" # inspect cached certificate expiry before ACME renewal
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
hyper = { version = "1.11", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1.4"
axum = "0.8"
tower = "0.5"
utoipa = { version = "5", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
ed25519-dalek = { version = "3", features = ["rand_core", "pkcs8"] }
sha2 = "0.11"
hmac = "0.13"
argon2 = "0.5"
subtle = "2.6"
webpki-roots = "1"
rand = "0.10"
rpassword = "7.4"
zeroize = { version = "1.9", features = ["derive"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
comfy-table = "7.2"
owo-colors = "4"
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
redb = "4"
directories = "6"
camino = { version = "1.2", features = ["serde1"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1.24", features = ["v7", "serde", "rng-getrandom"] }
jiff = { version = "0.2", features = ["serde"] }
humantime = "2.4"
dashmap = "6"
parking_lot = "0.12"
governor = "0.10"
async-trait = "0.1"
if-addrs = "0.15"
netdev = "0.45"
listeners = "0.6"
sysinfo = "0.39"
socket2 = "0.6"
nix = { version = "0.31", features = ["process", "signal", "fs", "user"] }
privdrop = "0.5.6"
tempfile = "3.27"
assert_cmd = "2.2"
predicates = "3.1"
insta = { version = "1.48", features = ["json"] }
proptest = "1.11"
criterion = "0.8"
worker = "0.8.5"
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true

# wasm-bindgen needs the target_features section to retain reference-types for catch wrappers.
[profile.release.package.wormholed-cloudflare]
strip = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
